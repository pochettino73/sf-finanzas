<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Son Fiol &mdash; Cierre mensual</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
:root{--bg:#0f172a;--c:#1e293b;--b:#334155;--t:#f1f5f9;--m:#94a3b8;--a:#3b82f6;--g:#22c55e;--r:#ef4444;--w:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t);padding:28px 24px;max-width:1120px;margin:0 auto}

/* HEADER */
.hdr{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid var(--b)}
.hdr-eye{font-size:11px;font-weight:600;color:var(--m);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.hdr-title{font-size:28px;font-weight:800;letter-spacing:-1px}
.sel{background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:8px;padding:8px 14px;font-size:13px;font-family:inherit;cursor:pointer;align-self:center}
.sel:focus{border-color:var(--a);outline:none}

/* SECTION */
.slbl{font-size:10px;font-weight:700;color:var(--m);text-transform:uppercase;letter-spacing:1px;margin-bottom:16px}
.sep{border:none;border-top:1px solid var(--b);margin:32px 0 28px}

/* B1 RESUMEN */
.b1{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px;margin-bottom:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:22px}
.card.main{border-color:rgba(59,130,246,.35)}
.c-lbl{font-size:10px;font-weight:600;color:var(--m);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.c-num{font-size:36px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.c-num.md{font-size:24px;letter-spacing:-1px}
.c-sub{font-size:12px;margin-top:10px}
.frase{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:13px 18px;font-size:13px;color:var(--m)}

/* B2 PARTIDAS */
.ptbl{width:100%;border-collapse:collapse;font-size:13px}
.ptbl th{font-size:10px;font-weight:600;color:var(--m);text-transform:uppercase;letter-spacing:.4px;padding:9px 12px;text-align:right;border-bottom:1px solid var(--b);white-space:nowrap}
.ptbl th:first-child{text-align:left}
.ptbl td{padding:10px 12px;text-align:right;border-bottom:1px solid rgba(51,65,85,.35);white-space:nowrap}
.ptbl td:first-child{text-align:left}
.ptbl tr:last-child td{border-bottom:none}
.ptbl tr:hover td{background:rgba(59,130,246,.04)}
.p-name{font-weight:500}
.p-tipo{font-size:10px;color:var(--m);display:block;font-weight:400}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 9px;border-radius:4px}
.tag.g{background:rgba(34,197,94,.12);color:var(--g)}
.tag.w{background:rgba(245,158,11,.12);color:var(--w)}
.tag.r{background:rgba(239,68,68,.12);color:var(--r)}
.pos{color:var(--g)} .neg{color:var(--r)} .neu{color:var(--m)}

/* B3 VARIACIONES */
.vlist{display:flex;flex-direction:column;gap:8px}
.vitem{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--c);border:1px solid var(--b);border-radius:8px}
.vdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.vdot.r{background:var(--r)} .vdot.w{background:var(--w)} .vdot.g{background:var(--g)}
.vtxt{font-size:13px;flex:1}

/* B4 CHART */
.chart-card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:20px}
.chart-sub{font-size:11px;color:var(--m);margin-bottom:14px}

/* B5 HISTORICO */
.det-outer{overflow-x:auto;border:1px solid var(--b);border-radius:12px}
.dtbl{border-collapse:collapse;font-size:11px;white-space:nowrap;width:100%}
.dtbl th{font-size:9px;font-weight:600;color:var(--m);text-transform:uppercase;padding:8px 10px;text-align:right;border-bottom:1px solid var(--b);background:var(--c);position:sticky;top:0;z-index:2}
.dtbl th:first-child{text-align:left;position:sticky;left:0;z-index:4;width:168px;min-width:168px}
.dtbl th:nth-child(2){position:sticky;left:168px;z-index:3;border-right:1px solid var(--b)}
.dtbl th.ch{background:rgba(59,130,246,.18);color:var(--a)}
.dtbl td{padding:6px 10px;text-align:right;border-bottom:1px solid rgba(51,65,85,.3);background:var(--c)}
.dtbl td:first-child{text-align:left;font-weight:500;position:sticky;left:0;background:var(--c);z-index:2;width:168px;min-width:168px}
.dtbl td:nth-child(2){position:sticky;left:168px;background:var(--c);z-index:1;border-right:1px solid var(--b)}
.dtbl tr:hover td,.dtbl tr:hover td:first-child,.dtbl tr:hover td:nth-child(2){background:#1a2840}
.dtbl .sh-r td,.dtbl .sh-r td:first-child{background:rgba(59,130,246,.04);color:var(--a);font-weight:700;font-size:10px;padding:10px 10px 4px}
.dtbl .tot-r td{font-weight:700;border-top:2px solid var(--b)}
.dtbl .bal-r td{font-weight:700;border-top:3px solid var(--a)}

.ft{text-align:center;color:var(--m);font-size:10px;margin-top:32px;padding-top:14px;border-top:1px solid var(--b)}
@media(max-width:700px){body{padding:14px 12px}.b1{grid-template-columns:1fr}.c-num{font-size:26px}.c-num.md{font-size:20px}}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="hdr-eye">Son Fiol &mdash; Cierre mensual</div>

<div class="slbl">Resumen</div>
<div class="b1" id="b1Cards"></div>
<div class="frase" id="frase"></div>

<hr class="sep">
<div class="slbl">Partidas del mes</div>

    <tbody id="b2Body"></tbody>

<hr class="sep">
<div class="slbl">Variaciones relevantes</div>
<div class="vlist" id="b3"></div>

<hr class="sep">
<div class="slbl">Evoluci&oacute;n mensual</div>
<div class="chart-card">

<hr class="sep">
<div class="slbl">Hist&oacute;rico completo</div>

function fmtMes(m){const[y,n]=m.split('-');return MES_ABR[+n-1]+' '+y.slice(2)}

function presI(){return Object.values(PRESUPUESTO.ingresos).reduce((s,v)=>s+v,0)}
function presG(){return Object.values(PRESUPUESTO.gastos).reduce((s,v)=>s+v,0)}

  const isIng = PING.includes(p);

  return isIng ? -desv/Math.abs(pres) : desv/pres;

  sel.addEventListener('change',()=>{curMes=sel.value;render()});
  document.getElementById('genDate').textContent=new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
  render();
}

function render(){
  document.getElementById('tituloMes').textContent='Resumen '+fmtMesFull(curMes);
  renderB1(); renderB2(); renderB3(); renderB4(); renderB5();
}

/* ===== B1: RESUMEN ===== */
function renderB1(){
  const m=curMes;
  const ing=totalI(m), gas=totalG(m), b=bal(m);
  const pI=presI(), pG=presG();
  const dIng=ing-pI, dGas=gas-pG;

  document.getElementById('b1Cards').innerHTML=`
    <div class="card main">
      <div class="c-lbl">Balance del mes</div>
      <div class="c-num" style="color:${b>=0?'var(--g)':'var(--r)'}">${eursign(b)}</div>
      <div class="c-sub" style="color:var(--m)">Presupuesto: ${eursign(pI+pG)}</div>
    </div>
    <div class="card">
      <div class="c-lbl">Ingresos</div>
      <div class="c-num md" style="color:${dIng>=0?'var(--g)':'var(--r)'}">${eur(ing)}</div>
      <div class="c-sub" style="color:${dIng>=0?'var(--g)':'var(--r)'}">${eursign(dIng)} vs ${eur(pI)} esperados</div>
    </div>
    <div class="card">
      <div class="c-lbl">Gastos</div>
      <div class="c-num md" style="color:var(--r)">${eur(Math.abs(gas))}</div>
      <div class="c-sub" style="color:${dGas>=0?'var(--g)':'var(--r)'}">${dGas>=0?eur(dGas)+' menos que presupuesto':eur(Math.abs(dGas))+' sobre presupuesto'}</div>
    </div>`;

  const gasOver=Math.abs(gas)>Math.abs(pG)*1.05;
  const ingUnder=ing<pI*0.95;
  let frase='Mes dentro de lo esperado.';
  if(gasOver&&ingUnder) frase='Mes con mayor gasto del habitual e ingresos inferiores a lo esperado.';
  else if(gasOver) frase='Mes con mayor gasto del habitual.';
  else if(ingUnder) frase='Mes con ingresos inferiores a lo esperado.';
  document.getElementById('frase').textContent=frase;
}

/* ===== B2: TABLA PARTIDAS ===== */
function renderB2(){
  const m=curMes;
  const rows=[];
  [...PING,...PGASTO].forEach(p=>{
    const isIng=PING.includes(p);
    const pres=isIng?(PRESUPUESTO.ingresos[p]||0):(PRESUPUESTO.gastos[p]||0);
    const real=val(p,m);
    const desv=real-pres;
    const desvPct=pres?desv/Math.abs(pres)*100:0;
    const bad=badness(p,real,pres);
    const cls=estadoCls(bad);
    rows.push({p,isIng,pres,real,desv,desvPct,cls,bad});
  });
  rows.sort((a,b)=>b.bad-a.bad);

  let html='';
  rows.forEach(r=>{
    const realDisp=r.isIng?eur(r.real):eur(Math.abs(r.real));
    const presDisp=r.isIng?eur(r.pres):eur(Math.abs(r.pres));
    const dColor=r.desv<0?'neg':r.desv>0?'pos':'neu';
    const pColor=r.desvPct<0?'neg':r.desvPct>0?'pos':'neu';
    html+=`<tr>
      <td><span class="p-name">${r.p}</span><span class="p-tipo">${r.isIng?'ingreso':'gasto'}</span></td>
      <td>${realDisp}</td>
      <td style="color:var(--m)">${presDisp}</td>
      <td class="${dColor}">${eursign(r.desv)}</td>
      <td class="${pColor}">${r.desvPct>=0?'+':''}${r.desvPct.toFixed(0)}%</td>
      <td><span class="tag ${r.cls}">${estadoLbl(r.cls)}</span></td>
    </tr>`;
  });
  document.getElementById('b2Body').innerHTML=html;
}

/* ===== B3: VARIACIONES RELEVANTES ===== */
function renderB3(){
  const m=curMes;
  const items=[];
  [...PING,...PGASTO].forEach(p=>{
    const isIng=PING.includes(p);
    const pres=isIng?(PRESUPUESTO.ingresos[p]||0):(PRESUPUESTO.gastos[p]||0);
    const real=val(p,m);
    const desv=real-pres;
    const bad=badness(p,real,pres);
    const cls=estadoCls(bad);
    if(cls==='g') return;
    items.push({p,isIng,desv,absDesv:Math.abs(desv),cls,bad});
  });
  items.sort((a,b)=>b.absDesv-a.absDesv);
  const top=items.slice(0,5);

  if(!top.length){
    document.getElementById('b3').innerHTML='<div class="vitem"><span class="vtxt" style="color:var(--m)">Todas las partidas dentro de lo esperado en este mes.</span></div>';
    return;
  }
  let html='';
  top.forEach(r=>{
    const ctxt=r.isIng?'vs esperado':'vs presupuesto';
    const txt=`${r.p}: ${eursign(r.desv)} ${ctxt}`;
    html+=`<div class="vitem"><div class="vdot ${r.cls}"></div><div class="vtxt">${txt}</div></div>`;
  });
  document.getElementById('b3').innerHTML=html;
}

/* ===== B4: EVOLUCIÓN ===== */
function renderB4(){
  if(chEvo) chEvo.destroy();
  const curIdx=ALL_MESES.indexOf(curMes);
  const labels=ALL_MESES.map(fmtMes);
  const dIng=ALL_MESES.map(m=>totalI(m));
  const dGas=ALL_MESES.map(m=>Math.abs(totalG(m)));
  const dBal=ALL_MESES.map(m=>bal(m));

  chEvo=new Chart(document.getElementById('chEvo').getContext('2d'),{
    type:'bar',
    data:{
      labels,
      datasets:[
        {
          label:'Ingresos',
          data:dIng,
          backgroundColor:ALL_MESES.map((_,i)=>i===curIdx?'rgba(34,197,94,.85)':'rgba(34,197,94,.35)'),
          borderRadius:3,order:2
        },
        {
          label:'Gastos',
          data:dGas,
          backgroundColor:ALL_MESES.map((_,i)=>i===curIdx?'rgba(239,68,68,.85)':'rgba(239,68,68,.35)'),
          borderRadius:3,order:2
        },
        {
          label:'Balance',
          data:dBal,
          type:'line',
          borderColor:'#3b82f6',
          backgroundColor:'transparent',
          pointRadius:ALL_MESES.map((_,i)=>i===curIdx?5:2),
          pointBackgroundColor:ALL_MESES.map((_,i)=>i===curIdx?'#3b82f6':'#3b82f6'),
          pointBorderColor:ALL_MESES.map((_,i)=>i===curIdx?'#fff':'transparent'),
          pointBorderWidth:2,
          borderWidth:2,fill:false,tension:.3,order:1
        }
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{labels:{color:'#94a3b8',font:{size:10},usePointStyle:true,pointStyle:'rectRounded'}},
        tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+eur(ctx.raw)}}
      },
      scales:{
        x:{grid:{color:'rgba(51,65,85,.3)'},ticks:{color:'#94a3b8',font:{size:9},maxRotation:45}},
        y:{grid:{color:'rgba(51,65,85,.3)'},ticks:{color:'#94a3b8',font:{size:10},callback:v=>v+' €'}}
      }
    }
  });
}

/* ===== B5: HISTÓRICO COMPLETO ===== */
function renderB5(){
  const curIdx=ALL_MESES.indexOf(curMes);
  const n=ALL_MESES.length;

  /* cabecera */
  let html='<thead><tr><th>Partida</th><th style="text-align:right">Pres.</th>';
  ALL_MESES.forEach((m,i)=>{
    html+=`<th class="${i===curIdx?'ch':''}">${fmtMes(m)}</th>`;
  });
  html+='<th>Media</th></tr></thead><tbody>';

  /* acumuladores por mes */
  const totIng={}; ALL_MESES.forEach(m=>totIng[m]=0);
  const totGas={}; ALL_MESES.forEach(m=>totGas[m]=0);

  /* --- INGRESOS --- */
  html+=`<tr class="sh-r"><td colspan="${n+3}">INGRESOS</td></tr>`;
  PING.forEach(p=>{
    const pres=PRESUPUESTO.ingresos[p]||0;
    let sum=0;
    html+=`<tr><td>${p}</td><td style="color:var(--m);text-align:right">${eur(pres)}</td>`;
    ALL_MESES.forEach((m,i)=>{
      const v=val(p,m); sum+=v; totIng[m]+=v;
      const bg=i===curIdx?'rgba(59,130,246,.12)':'';
      const col=v===0?'var(--m)':'var(--t)';
      html+=`<td style="background:${bg};color:${col}">${v===0?'&mdash;':eur(v)}</td>`;
    });
    html+=`<td style="color:var(--m)">${eur(sum/n)}</td></tr>`;
  });
  html+=`<tr class="tot-r"><td>Total ingresos</td><td style="color:var(--m);text-align:right">${eur(presI())}</td>`;
  ALL_MESES.forEach((m,i)=>{
    const v=totIng[m];
    const bg=i===curIdx?'rgba(59,130,246,.12)':'';
    html+=`<td style="background:${bg};color:var(--g)">${eur(v)}</td>`;
  });
  const avgI=ALL_MESES.reduce((s,m)=>s+totIng[m],0)/n;
  html+=`<td style="color:var(--m)">${eur(avgI)}</td></tr>`;

  /* --- GASTOS --- */
  html+=`<tr class="sh-r"><td colspan="${n+3}">GASTOS</td></tr>`;
  [...PGASTO].sort((a,b)=>(PRESUPUESTO.gastos[a]||0)-(PRESUPUESTO.gastos[b]||0)).forEach(p=>{
    const pres=PRESUPUESTO.gastos[p]||0;
    let sum=0;
    html+=`<tr><td>${p}</td><td style="color:var(--m);text-align:right">${eur(Math.abs(pres))}</td>`;
    ALL_MESES.forEach((m,i)=>{
      const v=val(p,m); sum+=v; totGas[m]+=v;
      const over=v!==0&&v<pres;
      const bg=i===curIdx?'rgba(59,130,246,.12)':(v===0?'':over?'rgba(239,68,68,.08)':'rgba(34,197,94,.05)');
      const col=i===curIdx?'var(--t)':v===0?'var(--m)':over?'var(--r)':'var(--t)';
      html+=`<td style="background:${bg};color:${col}">${v===0?'&mdash;':eur(Math.abs(v))}</td>`;
    });
    html+=`<td style="color:var(--m)">${eur(Math.abs(sum/n))}</td></tr>`;
  });
  html+=`<tr class="tot-r"><td>Total gastos</td><td style="color:var(--m);text-align:right">${eur(Math.abs(presG()))}</td>`;
  ALL_MESES.forEach((m,i)=>{
    const v=totGas[m];
    const bg=i===curIdx?'rgba(59,130,246,.12)':'';
    html+=`<td style="background:${bg};color:var(--r)">${eur(Math.abs(v))}</td>`;
  });
  const avgG=ALL_MESES.reduce((s,m)=>s+totGas[m],0)/n;
  html+=`<td style="color:var(--m)">${eur(Math.abs(avgG))}</td></tr>`;

  html+='</tbody>';

  /* footer balance */
  html+='<tfoot>';
  html+=`<tr class="bal-r"><td>Balance</td><td style="color:var(--m);text-align:right">${eursign(presI()+presG())}</td>`;
  ALL_MESES.forEach((m,i)=>{
    const b=totIng[m]+totGas[m];
    const bg=i===curIdx?'rgba(59,130,246,.18)':'';
    html+=`<td style="background:${bg};color:${b>=0?'var(--g)':'var(--r)'}">${eursign(b)}</td>`;
  });
  const avgB=(ALL_MESES.reduce((s,m)=>s+totIng[m],0)+ALL_MESES.reduce((s,m)=>s+totGas[m],0))/n;
  html+=`<td style="color:${avgB>=0?'var(--g)':'var(--r)'}">${eursign(avgB)}</td></tr>`;
  html+='</tfoot>';

  document.getElementById('dtbl').innerHTML=html;
}

init();
</script>
</body>
</html>
